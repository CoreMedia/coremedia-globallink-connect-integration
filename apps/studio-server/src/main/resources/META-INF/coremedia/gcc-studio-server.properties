# #################################################
# Propagation: register TranslationGlobalLink as update workflow of type
# lang-translation, so that it can be selected in the Propagation workflow.
# The same properties are set for the Workflow server in gcc-workflow.properties.
# #################################################

# Show the user task for validation of the Propagation workflow even if the validation
# succeeded, so that editors can always review and change the GlobalLink due date.
multisite.propagation.update-workflows.TranslationGlobalLink.type=lang-translation
multisite.propagation.update-workflows.TranslationGlobalLink.force-user-task=true
multisite.propagation.defaults.update-workflows.TranslationGlobalLink.grouped=true
