name: Test Website Deployment

# Verifies that the website still works for every pull request that touches
# it, including Dependabot updates: typecheck, build, and smoke test.

on:
  workflow_dispatch: {}
  workflow_call: {}
  pull_request:
    branches:
      - main
    paths:
      - website/**
      - .github/actions/setup-website/**
      - .github/workflows/pages-test-deploy.yml

# Restrict permissions to minimal required set
permissions:
  contents: read # Required for actions/checkout

env:
  # https://github.com/actions/runner-images/issues/70
  NODE_OPTIONS: "--max_old_space_size=4096"

jobs:
  env:
    uses: "./.github/workflows/env.yml"
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    needs:
      - env
    # Test deploy job only needs to read repository contents
    permissions:
      contents: read
    if: github.event.pull_request.draft == false
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        name: Setup website
        uses: ./.github/actions/setup-website
        with:
          npm-host: ${{ needs.env.outputs.npm-host }}
          npm-url: ${{ needs.env.outputs.npm-url }}
          npm-user: ${{ secrets.CM_NPM_USER }}
          npm-password: ${{ secrets.CM_NPM_READ_ONLY_PASSWORD }}
      - id: typecheck
        name: Typecheck
        working-directory: website
        run: pnpm run typecheck
      - id: build
        name: Build website
        working-directory: website
        run: pnpm run build
      - id: smoke-test
        name: Smoke test
        working-directory: website
        run: pnpm run smoke-test
