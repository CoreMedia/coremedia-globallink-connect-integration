# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Java (Maven) dependencies
  - package-ecosystem: "maven"
    directory: "/" # Root folder for Maven projects (pom.xml)
    ignore:
      - dependency-name: "com.coremedia*:*"
    commit-message:
      prefix: 'build(maven):'
    schedule:
      interval: "weekly"
    labels:
      - "scope/dependencies"
      - "type/build"
    open-pull-requests-limit: 5

  # Website dependencies managed by pnpm.
  # The "Website Dependencies" workflow updates @docusaurus/*, rebuilds the
  # overrides in website/pnpm-workspace.yaml, and reviews blocked advisories.
  # Ignore rules for blocked advisories are managed via
  # website/dependency-policy.json; do not edit them here.
  # See: website/DEPENDENCY_MAINTENANCE.md
  - package-ecosystem: "npm"
    directory: "/website" # Location of pnpm-lock.yaml
    ignore:
      # Updated by the "Website Dependencies" workflow.
      - dependency-name: "@docusaurus/*"
    groups:
      # Must be updated together, or the build fails.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
      website-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      website-security:
        applies-to: security-updates
        patterns:
          - "*"
    # pnpm refuses releases younger than minimumReleaseAge (1 day).
    cooldown:
      default-days: 2
    commit-message:
      prefix: 'build(pnpm):'
    schedule:
      interval: "weekly"
    labels:
      - "scope/dependencies"
      - "scope/website"
      - "type/build"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows" # Location of workflow files
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: 'ci(actions):'
    schedule:
      interval: "weekly"
    labels:
      - "scope/dependencies"
      - "scope/github-actions"
      - "type/ci"
    open-pull-requests-limit: 5
